services:
  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: always

  celery:
    build: .
    restart: always
    command: celery -A core worker -l info
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  mysql_data:
  static_volume: