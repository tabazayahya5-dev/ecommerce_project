{% extends 'base.html' %}

{% block title %}تأكيد حذف القسم - المتجر الإلكتروني{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-3 border-top border-danger border-4">
            <div class="card-body p-4 text-center">
                <div class="text-danger mb-3">
                    <i class="fas fa-folder-minus fa-3x"></i>
                </div>
                <h3 class="card-title fw-bold text-danger mb-3">تأكيد حذف القسم</h3>
                <p class="fs-5 text-muted mb-4">
                    هل أنت متأكد تماماً من رغبتك في حذف القسم: <br>
                    <strong class="text-dark">{{ category.name }}</strong>؟
                </p>
                <div class="alert alert-danger text-start mb-4">
                    <i class="fas fa-exclamation-triangle me-2"></i> **تنبيه هام:** قد يؤثر حذف القسم على عرض المنتجات المرتبطة به.
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'products:product_list' %}" class="btn btn-secondary px-4">
                            إلغاء
                        </a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="fas fa-trash-alt me-1"></i> نعم، إحذف القسم
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
