{% extends 'base.html' %}

{% block title %}تم بنجاح! 🎉{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8 text-center">
        <div class="card border-0 shadow-sm p-5">
            <div class="mb-3 text-success">
                <i class="fa-solid fa-circle-check fa-5x"></i>
            </div>
            <h1 class="fw-bold mb-3">شكراً لك! تم استلام طلبك بنجاح 🎉</h1>
            <p class="fs-5 text-muted mb-2">رقم الطلب الخاص بك هو: <strong class="text-dark">#{{ order.id }}</strong></p>
            <p class="text-secondary mb-4">سنقوم بإنهاء إجراءات الشحن والتوصيل في أقرب وقت.</p>
            <div>
                <a href="{% url 'products:product_list' %}" class="btn btn-primary btn-lg px-4">
                    <i class="fa-solid fa-cart-shopping me-2"></i> متابعة التسوق
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
