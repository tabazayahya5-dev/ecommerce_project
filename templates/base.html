<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}المتجر الإلكتروني{% endblock %}</title>
    <!-- Bootstrap 5 RTL CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar الرئيسي -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand text-warning" href="{% url 'products:product_list' %}">
                <i class="fa-solid font-sharp fa-store me-1"></i> متجري
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-navbar nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'products:product_list' %}">المنتجات</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <!-- رابط السلة مع العداد -->
                    <a href="{% url 'cart:cart_detail' %}" class="btn btn-outline-light position-relative">
                        <i class="fa-solid fa-cart-shopping"></i> السلة
                        {% if cart %}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ cart|length }}
                            </span>
                        {% endif %}
                    </a>

                    <!-- قائمة الحساب -->
                    {% if user.is_authenticated %}
                        <a href="{% url 'accounts:profile' %}" class="btn btn-light btn-sm">
                            <i class="fa-solid fa-user me-1"></i> {{ user.username }}
                        </a>
                        <form action="{% url 'accounts:logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm">خروج</button>
                        </form>
                    {% else %}
                        <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm">دخول</a>
                        <a href="{% url 'accounts:register' %}" class="btn btn-warning btn-sm">حساب جديد</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- المحتوى المتغير للظهور في بقية الصفحات -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer متواضع في أسفل الصفحة -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>جميع الحقوق محفوظة &copy; {% now "Y" %} - المتجر الإلكتروني</small>
        </div>
    </footer>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
