<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- استدعاء ملفات Bootstrap والتنسيق اتجاه يمين-يسار RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">تسجيل الدخول</h3>

                    <!-- 1. عرض الرسائل والتنبيهات (مثل اسم المستخدم خاطئ) -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- 2. نموذج تسجيل الدخول -->
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">اسم المستخدم</label>
                            <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">كلمة المرور</label>
                            <input type="password" name="password" class="form-control" id="id_password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">دخول</button>
                    </form>

                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-0 text-muted">ليس لديك حساب؟ <a href="{% url 'accounts:register' %}" class="text-decoration-none">إنشاء حساب جديد</a></p>                    </div>
                </div>
            </div>
        </div>
    </div>
    
</div>

</body>
</html>
