{% extends 'base.html' %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 fw-bold">تسجيل الدخول</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">دخول</button>
                </form>

                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0 text-muted">ليس لديك حساب؟ <a href="{% url 'accounts:register' %}" class="text-decoration-none">إنشاء حساب جديد</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
